name: Feature Request
description: Suggest an idea or enhancement for milanuncios-cli
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement to `milanuncios-cli`!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A concise description of what the problem or limitation is.
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you have considered.
