name: Bug Report
description: Create a report to help us fix a bug or unexpected behavior
title: "[bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill out the form below with as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or exact command line to reproduce the behavior.
      placeholder: |
        1. Run 'milanuncios ...'
        2. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "milanuncios --version"
  - type: input
    id: os
    attributes:
      label: OS / Environment
      placeholder: "e.g. Ubuntu 22.04, macOS Sequoia 15.1, Windows 11"
