name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: verify formatting
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: run tests
        run: go test -v ./... -count=1
      - name: build binary
        run: go build -v ./cmd/milanuncios
